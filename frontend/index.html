<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Starter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="hero-top">
          <div>
            <p class="eyebrow">Olx-style marketplace</p>
            <h1>Sprzedaj i kupuj lokalnie</h1>
            <p>Nowoczesne ogłoszenia z galerią zdjęć, kategoriami i szybkim kontaktem.</p>
          </div>
          <div class="hero-actions">
            <button id="openCart">Koszyk</button>
            <button id="admin">Admin</button>
          </div>
        </div>
        <div class="filters">
          <input id="search" placeholder="Szukaj ogłoszeń..." />
          <select id="categoryFilter">
            <option value="">Wszystkie kategorie</option>
            <option value="Motoryzacja">Motoryzacja</option>
            <option value="Elektronika">Elektronika</option>
            <option value="Meble">Meble</option>
            <option value="Moda">Moda</option>
            <option value="Usługi">Usługi</option>
          </select>
        </div>
        <div id="catalog"></div>
        <div id="cart" style="display:none; margin-top:1rem;"></div>
      </section>
    </main>

    <script src="site-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
