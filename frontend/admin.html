<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin</title>
  </head>
  <body>
    <main class="shell admin-shell">
      <section class="hero admin-panel">
        <h1>Admin Panel</h1>
        <div class="admin-login">
          <label>Username: <input id="username" /></label>
          <label>Password: <input id="password" type="password" /></label>
          <button id="login">Zaloguj</button>
          <button id="registerBtn" type="button">Zarejestruj</button>
        </div>
        <p class="hint">Demo: użytkownik <strong>admin</strong> z hasłem <strong>admin123</strong> albo stwórz własne konto.</p>
        <div id="controls" style="display:none;">
          <h2>Dodaj ogłoszenie</h2>
          <form id="adForm" class="ad-form">
            <input id="title" placeholder="Tytuł ogłoszenia" required />
            <input id="price" placeholder="Cena" required />
            <textarea id="desc" placeholder="Opis"></textarea>
            <input id="images" placeholder="Obrazki (URL, oddzielone przecinkiem)" />
            <select id="category">
              <option value="Telefony">Telefony</option>
              <option value="Laptopy">Laptopy</option>
              <option value="Gaming">Gaming</option>
              <option value="Audio">Audio</option>
              <option value="Akcesoria">Akcesoria</option>
            </select>
            <input id="location" placeholder="Miasto / lokalizacja" />
            <button id="add" type="submit">Dodaj ogłoszenie</button>
          </form>
          <h3>Aktualne ogłoszenia</h3>
          <div id="productList"></div>
        </div>
      </section>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
